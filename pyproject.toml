[project]
name = "hindcast"
version = "0.1.0"
description = "Evidence-grounded AI investigations of infrastructure outages."
readme = "README.md"
license = "MIT"
requires-python = "==3.14.*"
dependencies = [
    "azure-ai-contentunderstanding==1.1.0",
    "azure-ai-projects==2.9.0",
    "azure-identity==1.27.0",
    "azure-storage-blob==12.31.0",
    # Checks the model's output locally against the same schema dict the service
    # enforces, so a disagreement shows up as a schema error, not a crash later.
    "jsonschema==4.26.0",
    "openai==3.40.0",
    "ruamel-yaml==0.19.1",
]

# Exact pins. uv.lock records the full tree with hashes. Dependabot proposes
# the updates (.github/dependabot.yml).
[dependency-groups]
dev = [
    # Imported directly by a test to build a request for openai.APITimeoutError;
    # openai depends on it, so this pin moves with openai's range.
    "httpx2==2.16.0",
    "pip-audit==2.10.1",
    # [nodejs] brings node as a locked, hashed wheel; without it pyright downloads
    # node at first run, outside the lock.
    "pyright[nodejs]==1.1.414",
    "pytest==9.1.1",
    "ruff==0.17.3",
    "yamllint==1.38.0",
    "zizmor==1.31.1",
]

[tool.uv]
required-version = "==0.13.5"
# Not built or installed as a package yet: tests import from src/ directly.
# The container image in the deployment phase decides how the app is packaged.
package = false

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "standard"
# Every parameter in src/ carries a type. Tests use pytest fixtures untyped, and
# import the evaluation scripts by plain name, as the scripts import each other.
executionEnvironments = [
    { root = "src", reportMissingParameterType = "error" },
    { root = "tests", extraPaths = ["src", "eval/model-selection/dev-outage-v1"] },
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
