[project]
name = "hindcast"
version = "0.1.0"
description = "Evidence-grounded AI investigations of infrastructure outages."
readme = "README.md"
license = "MIT"
requires-python = "==3.15.*"
dependencies = [
    "azure-ai-contentunderstanding==1.1.0",
    "azure-ai-projects==2.9.0",
    "azure-identity==1.27.0",
    "azure-storage-blob==12.31.0",
    "openai==3.40.0",
    "ruamel-yaml==0.19.1",
]

# Exact pins. uv.lock records the full tree with hashes. Dependabot is set up to
# propose updates but does not support Python 3.15 yet (issue #8): until it does,
# these pins move by hand.
[dependency-groups]
dev = [
    "pip-audit==2.10.1",
    "pytest==9.1.1",
    "ruff==0.17.3",
    "yamllint==1.38.0",
    "zizmor==1.31.1",
]

[tool.uv]
required-version = "==0.13.5"
# Not built or installed as a package yet: tests import from src/ directly.
# The container image in the deployment phase decides how the app is packaged.
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
target-version = "py315"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
