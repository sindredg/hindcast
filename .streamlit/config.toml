# The page's theme: the project palette (black page, #141414 boxes, green for
# the focal element). Streamlit reads this file from the directory it starts
# in: the repository root locally, /app in the image (Dockerfile).
[theme]
base = "dark"
primaryColor = "#22c55e"
backgroundColor = "#000000"
secondaryBackgroundColor = "#141414"
textColor = "#f5f5f5"
linkColor = "#22c55e"
# Not in the diagram palette: a border needs a grey darker than the labels'.
borderColor = "#2a2a2a"
codeBackgroundColor = "#1c1c1c"
showWidgetBorder = true
baseRadius = "0.5rem"

[theme.sidebar]
backgroundColor = "#0a0a0a"
secondaryBackgroundColor = "#141414"

[client]
# No "Deploy" button or developer menu on the page.
toolbarMode = "viewer"

[server]
# Off by default since Streamlit 1.67.0; set here so a change of default
# cannot open an HTTP and MCP route that drives the page without a browser.
enableAgentApi = false
