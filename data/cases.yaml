# Case registry: the outages Hindcast investigates and their source files.
#
# The source files are not committed: status pages and postmortems are the
# providers' copyrighted pages. Each one is captured with
# `python -m hindcast.capture` to data/sources/<case_id>/<filename> (ignored by
# Git) and uploaded to Blob Storage at sources/<case_id>/<filename>. sha256 pins
# the exact file and retrieved_at says when it was taken, so a changed upstream
# copy fails verify_local_files instead of being read.
#
# kind status-updates is the evidence. kind chart is a Cloudflare Radar image,
# committed under data/charts/<case_id>/ (CC BY 4.0, see its README), and
# described as evidence. kind postmortem is the answer key and
# never reaches the investigator. Google Cloud's status snapshot also holds the
# incident report entries Google adds after the outage; the evidence cut
# removes them.
#
# title is the incident's public title on the status page, as the provider
# wrote it. started_at is when the outage began, as the status snapshot states
# it (Statuspage started_at, Google begin), in UTC to the second; the library
# only serves a case documents published before it.

