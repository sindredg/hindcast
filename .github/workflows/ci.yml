name: CI

on:
  pull_request:
  push:
    branches: [main]
  # A manual run from main pushes the image again without a new commit
  # (deployment runbook).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python lint and tests
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # uv installs the Python in .python-version and the locked tools.
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          version: "0.13.5"
      - run: uv sync --frozen --all-extras
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen pyright
      - run: uv run --frozen pytest -v

  yaml:
    name: YAML and workflow lint
    runs-on: ubuntu-26.04
    env:
      ACTIONLINT_VERSION: "1.7.12"
      # From actionlint_1.7.12_checksums.txt, copied into this file so a
      # replaced release asset fails the check. Moves by hand with the version.
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          version: "0.13.5"
      - run: uv sync --frozen
      - run: uv run --frozen yamllint --strict .
      - name: zizmor
        # The token lets zizmor check pinned SHAs and known-vulnerable actions
        # against GitHub. It is read-only under the workflow permissions.
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --frozen zizmor --persona=auditor .github/workflows
      - name: actionlint
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  audit:
    name: Dependency audit
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          version: "0.13.5"
      - run: uv sync --frozen
      # Audits every locked package, development tools included. Any finding
      # fails the job. An ignore needs --ignore-vuln with a comment that holds
      # the reachability evidence, its limits, and when to check again.
      - run: |
          uv export --frozen --all-groups --all-extras --no-emit-project \
            --format requirements.txt -o "$RUNNER_TEMP/requirements.txt"
          uv run --frozen pip-audit --strict --disable-pip --require-hashes \
            -r "$RUNNER_TEMP/requirements.txt"

  infra:
    name: Image and infrastructure
    runs-on: ubuntu-26.04
    env:
      HADOLINT_VERSION: "2.15.1"
      # From the release's checksums.sha256, copied into this file so a
      # replaced release asset fails the check. Moves by hand with the version.
      HADOLINT_SHA256: c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507
      BICEP_VERSION: "0.48.1"
      SHELLCHECK_VERSION: "0.11.0"
      # The release publishes no checksum file; this is the SHA-256 of the
      # archive as downloaded on 2026-10-30. Moves by hand with the version.
      SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: hadolint
        run: |
          curl -fsSL -o "$RUNNER_TEMP/hadolint" \
            "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-linux-x86_64"
          echo "$HADOLINT_SHA256  $RUNNER_TEMP/hadolint" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/hadolint"
          "$RUNNER_TEMP/hadolint" Dockerfile
      - name: shellcheck
        run: |
          archive="shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/$archive"
          echo "$SHELLCHECK_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xJf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" infra/scripts/*.sh
      # The runner's az CLI installs the pinned Bicep; infra/bicepconfig.json
      # raises the analyzer rules to errors.
      - name: Bicep build and lint
        run: |
          az bicep install --version "v${BICEP_VERSION}"
          az bicep version
          az bicep build --file infra/main.bicep --stdout > /dev/null
          az bicep lint --file infra/main.bicep
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      # Builds the image on every run and proves the Dockerfile; the push to
      # the registry is a separate step that runs only from main.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          tags: hindcast:ci

  image:
    name: Push the image
    # From main only: sign in to Azure with the run's OIDC token (no stored
    # credential) and push the image. The job runs in the "azure" deployment
    # environment: its branch policy admits only main, its name is the subject
    # the federated credential accepts, and its secrets hold the identity and
    # registry IDs: resource names and IDs, not keys, kept out of public logs.
    needs: infra
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    environment: azure
    permissions:
      contents: read  # the build context
      id-token: write  # the OIDC token azure/login exchanges for the CI identity
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906  # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Sign in to the registry
        env:
          REGISTRY: ${{ secrets.AZURE_CONTAINER_REGISTRY_NAME }}
        run: az acr login --name "$REGISTRY"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.AZURE_CONTAINER_REGISTRY_NAME }}.azurecr.io/hindcast:${{ github.sha }}
            ${{ secrets.AZURE_CONTAINER_REGISTRY_NAME }}.azurecr.io/hindcast:main
