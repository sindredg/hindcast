name: CI

on:
  pull_request:
  push:
    branches: [main]
  # A manual run from main pushes the image again without a new commit
  # (deployment runbook).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python lint and tests
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # The seal record test walks every committed version of
          # eval/sealed/seals.json, and a shallow clone fails it (issue #33).
          fetch-depth: 0
      # uv installs the Python in .python-version and the locked tools.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.7"
      # --locked, not --frozen: a pin edited in pyproject.toml without a relock fails here.
      - run: uv sync --locked --all-extras
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen pyright
      - run: uv run --frozen pytest -v

  yaml:
    name: YAML and workflow lint
    runs-on: ubuntu-26.04
    env:
      ACTIONLINT_VERSION: "1.7.12"
      # From actionlint_1.7.12_checksums.txt, copied into this file so a
      # replaced release asset fails the check. Moves by hand with the version.
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.7"
      - run: uv sync --locked
      - run: uv run --frozen yamllint --strict .
      - name: zizmor
        # The token lets zizmor check pinned SHAs and known-vulnerable actions
        # against GitHub. It is read-only under the workflow permissions.
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --frozen zizmor --persona=auditor .github/workflows
      - name: actionlint
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  audit:
    name: Dependency audit
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.7"
      - run: uv sync --locked
      # Audits every locked package, development tools included. Any finding
      # fails the job. An ignore needs --ignore-vuln with a comment that holds
      # the reachability evidence, its limits, and when to check again.
      - run: |
          uv export --frozen --all-groups --all-extras --no-emit-project \
            --format requirements.txt -o "$RUNNER_TEMP/requirements.txt"
          uv run --frozen pip-audit --strict --disable-pip --require-hashes \
            -r "$RUNNER_TEMP/requirements.txt"

  infra:
    name: Image and infrastructure
    runs-on: ubuntu-26.04
    env:
      HADOLINT_VERSION: "2.15.1"
      # From the release's checksums.sha256, copied into this file so a
      # replaced release asset fails the check. Moves by hand with the version.
      HADOLINT_SHA256: c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507
      BICEP_VERSION: "0.49.2"
      SHELLCHECK_VERSION: "0.11.0"
      # The release publishes no checksum file; this is the SHA-256 of the
      # archive as downloaded on 2026-10-30. Moves by hand with the version.
      SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: hadolint
        run: |
          curl -fsSL -o "$RUNNER_TEMP/hadolint" \
            "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-linux-x86_64"
          echo "$HADOLINT_SHA256  $RUNNER_TEMP/hadolint" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/hadolint"
          "$RUNNER_TEMP/hadolint" Dockerfile
      - name: shellcheck
        run: |
          archive="shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/$archive"
          echo "$SHELLCHECK_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xJf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" infra/scripts/*.sh
      # The runner's az CLI installs the pinned Bicep; infra/bicepconfig.json
      # raises the analyzer rules to errors. A compiler warning (a wrong
      # property type, BCP036) still exits 0, so any diagnostic fails the step.
      # The version check is off: it prints a warning whenever a Bicep newer
      # than the pin is released, which would fail the step on every run.
      - name: Bicep build and lint
        env:
          AZURE_BICEP_CHECK_VERSION: "false"
        run: |
          az bicep install --version "v${BICEP_VERSION}"
          az bicep version
          # main.bicep builds every module under infra/modules/ with it.
          for file in infra/main.bicep; do
            log="$RUNNER_TEMP/bicep-$(basename "$file").log"
            failed=0
            az bicep build --file "$file" --stdout 2> "$log" > /dev/null || failed=1
            az bicep lint --file "$file" 2>> "$log" || failed=1
            if [ "$failed" -ne 0 ] || [ -s "$log" ]; then cat "$log"; exit 1; fi
          done
      # The image has no .git: the commit, the src/ tree, and the prompts' and
      # registries' blob hashes go in as a file (hindcast.provenance), which
      # the Dockerfile copies. Standard library only, so the runner's Python.
      - name: Write the provenance manifest
        run: python3 src/hindcast/provenance.py provenance.json
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
        with:
          # The builder image, by digest. Left out, the action pulls the
          # floating buildx-stable-1 tag. BuildKit v0.34.2, the tag's digest
          # on 2026-11-07. Dependabot does not track it; it moves by hand.
          driver-opts: |
            image=moby/buildkit:v0.34.2@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe
      # Builds the image on every run and proves the Dockerfile; the push to
      # the registry is a separate step that runs only from main.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: hindcast:ci
      # A build proves the Dockerfile, not that the page starts. Run the image
      # as it runs on Azure: its own non-root user, the stored result loads
      # from inside the image, and Streamlit answers on its health path.
      - name: Run the image
        run: |
          test "$(docker run --rm hindcast:ci id -u)" = 10001
          # A run from the page names its code from the manifest, and the
          # runtime user can write build/ and a case's challenges/ directory.
          source=$(docker run --rm hindcast:ci python -c \
            "from hindcast import investigate; print(investigate.code_provenance()['source'])")
          test "$source" = image
          docker run --rm hindcast:ci sh -c \
            "touch build/check && touch eval/investigations/cloudflare-2026-02-20/challenges/check"
          # The committed results stay root's, in root's directories: appending
          # to one and removing one both have to fail.
          if docker run --rm hindcast:ci sh -c \
            "echo x >> eval/investigations/cloudflare-2026-02-20/20261102T181721Z-v3.json"; then
            echo "a committed result is writable by the runtime user"; exit 1
          fi
          if docker run --rm hindcast:ci sh -c \
            "rm eval/investigations/cloudflare-2026-02-20/20261102T181721Z-v3.json"; then
            echo "a committed result is removable by the runtime user"; exit 1
          fi
          # The page's runtime download, as the runtime user into /app, from
          # a stub container: it has to stage and move inside build/.
          docker run --rm -i hindcast:ci python - <<'PY'
          import hashlib, json
          from pathlib import Path
          from hindcast import runtime
          data = b"{}"
          name = "build/evidence/check.json"
          manifest = json.dumps({name: hashlib.sha256(data).hexdigest()}).encode()
          blobs = {name: data, runtime.MANIFEST: manifest}
          class Blob:
              def __init__(self, data): self.data = data
              def readall(self): return self.data
          class Container:
              def download_blob(self, name): return Blob(blobs[name])
          assert runtime.materialize(Container(), Path("/app")) == 1
          assert Path("/app", name).read_bytes() == data
          print("runtime download: ok")
          PY
          docker run --rm hindcast:ci python -c \
            "from hindcast import app; path = app.default_result(app.RESULT_DIR);"\
            " print(app.load_result(path).case_id)"
          docker run -d --name page -p 8501:8501 hindcast:ci
          for _ in $(seq 1 30); do
            if [ "$(curl -fsS http://localhost:8501/_stcore/health || true)" = ok ]; then
              echo "health: ok"
              exit 0
            fi
            sleep 2
          done
          docker logs page
          exit 1
      # The push job pushes this image, the one the checks above ran, instead
      # of building again. From main only: a pull request uploads nothing.
      - name: Save the tested image
        if: >-
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
          && github.ref == 'refs/heads/main'
        run: docker save hindcast:ci | gzip > "$RUNNER_TEMP/hindcast-image.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: >-
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
          && github.ref == 'refs/heads/main'
        with:
          name: hindcast-image
          path: ${{ runner.temp }}/hindcast-image.tar.gz
          retention-days: 1
          if-no-files-found: error

  image:
    name: Push the image
    # From main only: sign in to Azure with the run's OIDC token (no stored
    # credential) and push the image. The job runs in the "azure" deployment
    # environment: its branch policy admits only main, its name is the subject
    # the federated credential accepts, and its secrets hold the identity and
    # registry IDs: resource names and IDs, not keys, kept out of public logs.
    # Every check has to pass first: the ruleset's required checks guard a
    # merge, not a push or a manual run from main.
    needs: [python, yaml, audit, infra]
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    environment: azure
    permissions:
      id-token: write  # the OIDC token azure/login exchanges for the CI identity
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: hindcast-image
          path: ${{ runner.temp }}
      - name: Load the tested image
        run: gunzip -c "$RUNNER_TEMP/hindcast-image.tar.gz" | docker load
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906  # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Sign in to the registry
        env:
          REGISTRY: ${{ secrets.AZURE_CONTAINER_REGISTRY_NAME }}
        run: az acr login --name "$REGISTRY"
      - name: Push the tested image
        env:
          IMAGE: ${{ secrets.AZURE_CONTAINER_REGISTRY_NAME }}.azurecr.io/hindcast
          SHA: ${{ github.sha }}
        run: |
          for tag in "$SHA" main; do
            docker tag hindcast:ci "$IMAGE:$tag"
            docker push "$IMAGE:$tag"
          done
