name: hindcast
infra:
  provider: bicep
  path: infra
services:
  web:
    host: containerapp
    # The image is built in CI and pushed to the registry from main; azd only
    # points the container app at it (deployment runbook).
    image: ${AZURE_CONTAINER_REGISTRY_ENDPOINT}/hindcast:${HINDCAST_IMAGE_TAG}
    docker:
      imagePassthrough: true
hooks:
  # Bicep cannot create an Entra app registration; the scripts do, and finish
  # it with the app's URL and the identity's federated credential afterwards.
  # "bash" explicitly: the scripts use bash arrays, and azd's sh is the
  # system shell, which may be dash.
  preprovision:
    shell: sh
    run: bash infra/scripts/app-registration.sh
  postprovision:
    shell: sh
    run: bash infra/scripts/app-registration-complete.sh
