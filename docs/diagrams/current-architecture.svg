<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 464" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="current-architecture-title current-architecture-desc" id="current-architecture-root">
        <title id="current-architecture-title">Hindcast as built: milestone 1</title>
        <desc id="current-architecture-desc">On an operator workstation signed in with Entra ID, Hindcast's capture command reads the providers' status APIs and postmortem pages, the Azure CLI uploads the captured files to Blob Storage, Hindcast's code calls the two pinned model deployments through the Foundry project, and git reaches GitHub through pull requests; the project is connected to Application Insights, which the code does not use yet, and the Foundry resource and the storage account accept no keys.</desc>
        <defs>
      <style>#current-architecture-root { --color-paper:   #2d3142;
      --color-ink:     #f5f5f5;
      --color-muted:   #bfc0c0;
      --color-accent:  #f08a59;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #current-architecture-root { font-family: var(--font-sans); color: var(--color-ink); }
      #current-architecture-root .diagram-container { width: 100%; overflow-x: auto; }
      #current-architecture-root .diagram-container { overflow-x: visible; }</style>
