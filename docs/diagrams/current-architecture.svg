      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #current-architecture-root { font-family: var(--font-sans); color: var(--color-ink); }
      #current-architecture-root .diagram-container { width: 100%; overflow-x: auto; }
      #current-architecture-root .diagram-container { overflow-x: visible; }</style>
