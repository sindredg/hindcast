<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="current-architecture-title current-architecture-desc" id="current-architecture-root">
        <title id="current-architecture-title">Hindcast as built</title>
        <desc id="current-architecture-desc">On an operator workstation signed in with Entra ID, Hindcast's capture command reads the providers' status pages, postmortems, and Radar charts; the Azure CLI and Hindcast's code store the captured files in Blob Storage, and Hindcast's ingestion reads them back and writes the evidence, extracts, and key drafts there with its own Entra token. Hindcast's code calls the pinned model deployments through the Foundry project with the Responses API, and calls Content Understanding on the Foundry resource, whose analyzers use the gpt-5-mini and text-embedding-3-large deployments, with a role held only while extraction runs. A portal evaluation calls the deployments as the signed-in user during its runs, and git reaches GitHub through pull requests. The project is connected to Application Insights, which the code does not use yet; the Foundry resource and the storage account accept no keys.</desc>
