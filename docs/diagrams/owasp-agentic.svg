<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 568" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="owasp-agentic-title owasp-agentic-desc" id="owasp-agentic-root">
        <title id="owasp-agentic-title">Where the OWASP agentic risks sit in Hindcast</title>
        <desc id="owasp-agentic-desc">Status updates, charts, and library postmortems are third-party text; every tool item passes Prompt Shields (ASI01) before the investigator agent reads it through three read-only tools under call and time caps (ASI02, ASI05, ASI10). Citation checks flag unsupported items (ASI09); the result file is written once, and a failed run is still written as incomplete with its reason (ASI08). The reader page shows it behind Entra sign-in (ASI09); the challenger agent and the offline judge read the stored result (ASI07, open gaps 109 and 110). The library has an open gap (ASI06, 112). Across the system, identity (ASI03, open gap 111) and the supply chain (ASI04) apply.</desc>
