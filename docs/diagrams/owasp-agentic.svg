      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #owasp-agentic-root { font-family: var(--font-sans); color: var(--color-ink); }
      #owasp-agentic-root .diagram-container { width: 100%; overflow-x: auto; }
      #owasp-agentic-root .diagram-container { overflow-x: visible; }</style>
