<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 768" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="prior-knowledge-check-title prior-knowledge-check-desc" id="prior-knowledge-check-root">
        <title id="prior-knowledge-check-title">The prior-knowledge check</title>
        <desc id="prior-knowledge-check-desc">The collector refuses to run when the prompt, the case registry, the code, or its lock file differs from the last commit, or when today's result file exists, before any model call; otherwise it reads the model version from the deployment, asks about each showcase outage from its provider, title, and date at effort medium, writes one result file, and prints token counts but never the answers.</desc>
        <defs>
      <style>#prior-knowledge-check-root { --color-paper:   #2d3142;
      --color-ink:     #f5f5f5;
      --color-muted:   #bfc0c0;
      --color-accent:  #f08a59;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #prior-knowledge-check-root { font-family: var(--font-sans); color: var(--color-ink); }
      #prior-knowledge-check-root .diagram-container { width: 100%; overflow-x: auto; }
      #prior-knowledge-check-root .diagram-container { overflow-x: visible; }</style>
          <marker id="prior-knowledge-check-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker>
          <marker id="prior-knowledge-check-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker>
          <marker id="prior-knowledge-check-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#739fdf"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#2d3142"/>

        <!-- Arrows -->
        <line x1="360" y1="80" x2="360" y2="104" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#prior-knowledge-check-arrow)"/>
        <line x1="360" y1="200" x2="360" y2="232" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#prior-knowledge-check-arrow)"/>
        <line x1="360" y1="328" x2="360" y2="360" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#prior-knowledge-check-arrow)"/>
        <line x1="360" y1="416" x2="360" y2="448" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#prior-knowledge-check-arrow)"/>
        <line x1="360" y1="512" x2="360" y2="544" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#prior-knowledge-check-arrow)"/>
        <line x1="360" y1="608" x2="360" y2="640" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#prior-knowledge-check-arrow)"/>
        <path d="M 488,152 H 752 Q 760,152 760,160 V 184" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#prior-knowledge-check-arrow)"/>
        <path d="M 488,280 H 752 Q 760,280 760,272 V 248" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#prior-knowledge-check-arrow)"/>

        <!-- Arrow labels -->
        <rect x="368" y="210" width="28" height="12" rx="2" fill="#2d3142"/>
        <text x="382" y="219" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>
        <rect x="368" y="338" width="24" height="12" rx="2" fill="#2d3142"/>
        <text x="380" y="347" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>
        <rect x="608" y="132" width="24" height="12" rx="2" fill="#2d3142"/>
        <text x="620" y="141" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>
        <rect x="606" y="260" width="28" height="12" rx="2" fill="#2d3142"/>
        <text x="620" y="269" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>

        <!-- Nodes -->
        <rect x="240" y="40" width="240" height="40" rx="20" fill="#2d3142"/>
        <rect x="240" y="40" width="240" height="40" rx="20" fill="#bfc0c0" fill-opacity="0.10" stroke="#949eb2" stroke-width="1"/>
        <text x="360" y="64" fill="#f5f5f5" font-size="10" font-weight="400" font-family="'Geist Mono', monospace" text-anchor="middle">prior collect --deployment</text>
        <polygon points="360,104 488,152 360,200 232,152" fill="#2d3142"/>
        <polygon points="360,104 488,152 360,200 232,152" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
        <text x="360" y="148" fill="#f5f5f5" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Prompt, registry, code, lock</text>
        <text x="360" y="164" fill="#f5f5f5" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">match the last commit?</text>
        <polygon points="360,232 488,280 360,328 232,280" fill="#2d3142"/>
        <polygon points="360,232 488,280 360,328 232,280" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
        <text x="360" y="276" fill="#f5f5f5" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Today's result file</text>
        <text x="360" y="292" fill="#f5f5f5" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">already exists?</text>
        <rect x="240" y="360" width="240" height="56" rx="6" fill="#2d3142"/>
        <rect x="240" y="360" width="240" height="56" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
        <text x="360" y="386" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Read the model version</text>
        <text x="360" y="402" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">from the deployment</text>
        <rect x="240" y="448" width="240" height="64" rx="6" fill="#2d3142"/>
        <rect x="240" y="448" width="240" height="64" rx="6" fill="#f08a59" fill-opacity="0.10" stroke="#f08a59" stroke-width="1"/>
        <text x="360" y="474" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Ask about each showcase case</text>
        <text x="360" y="490" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">provider · title · date · medium</text>
        <rect x="240" y="544" width="240" height="64" rx="6" fill="#2d3142"/>
        <rect x="240" y="544" width="240" height="64" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
        <text x="360" y="570" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Write the result file</text>
        <text x="360" y="586" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">version · effort · hashes · commit</text>
        <rect x="224" y="640" width="272" height="40" rx="20" fill="#2d3142"/>
        <rect x="224" y="640" width="272" height="40" rx="20" fill="#bfc0c0" fill-opacity="0.10" stroke="#949eb2" stroke-width="1"/>
        <text x="360" y="664" fill="#f5f5f5" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Print token counts, never answers</text>
        <rect x="640" y="184" width="240" height="64" rx="6" fill="#2d3142"/>
        <rect x="640" y="184" width="240" height="64" rx="6" fill="#f08a59" fill-opacity="0.05" stroke="#f08a59" stroke-opacity="0.50" stroke-width="1" stroke-dasharray="4,4"/>
        <text x="760" y="210" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Refuse, call no model</text>
        <text x="760" y="226" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">error names the file · exit 1</text>

        <!-- Legend strip -->
        <line x1="40" y1="712" x2="960" y2="712" stroke="#f5f5f5" stroke-opacity="0.10" stroke-width="0.8"/>
        <text x="40" y="728" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="40" y="740" width="22" height="10" rx="5" fill="#bfc0c0" fill-opacity="0.10" stroke="#949eb2" stroke-width="1"/>
        <text x="68" y="748" fill="#bfc0c0" font-size="8.5" font-family="'Geist', sans-serif">Start or end</text>

        <rect x="148" y="740" width="14" height="10" rx="2" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
        <text x="168" y="748" fill="#bfc0c0" font-size="8.5" font-family="'Geist', sans-serif">Step</text>

        <polygon points="224,739 232,745 224,751 216,745" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
        <text x="240" y="748" fill="#bfc0c0" font-size="8.5" font-family="'Geist', sans-serif">Decision</text>

        <rect x="300" y="740" width="14" height="10" rx="2" fill="#f08a59" fill-opacity="0.10" stroke="#f08a59" stroke-width="1"/>
        <text x="320" y="748" fill="#bfc0c0" font-size="8.5" font-family="'Geist', sans-serif">Model calls</text>

        <rect x="400" y="740" width="14" height="10" rx="2" fill="#f08a59" fill-opacity="0.05" stroke="#f08a59" stroke-opacity="0.50" stroke-width="1" stroke-dasharray="4,4"/>
        <text x="420" y="748" fill="#bfc0c0" font-size="8.5" font-family="'Geist', sans-serif">Refusal</text>

        <text x="960" y="728" fill="#949eb2" font-size="8.5" font-family="'Geist', sans-serif" text-anchor="end">The answers stay unread until the scoring rubric is frozen</text>
      </svg>
