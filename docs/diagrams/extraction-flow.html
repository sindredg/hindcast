<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>What the investigator can read</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #2d3142;
      --color-ink:     #f5f5f5;
      --color-muted:   #bfc0c0;
      --color-accent:  #f08a59;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 1000px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Extraction · built</p>
    <h1>What the investigator can read</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 1000 472" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="extraction-flow-title extraction-flow-desc">
        <title id="extraction-flow-title">What the investigator can read</title>
        <desc id="extraction-flow-desc">Three lanes. Case evidence: each case's status snapshot, read from Blob Storage and checked against its SHA-256, goes through the evidence cut, which keeps the updates before the resolved one and drops the resolved update's text and any report entries, and becomes the case evidence with its Radar chart descriptions. Library: each library page, picked by the case's symptoms, is cut to its article and extracted; a page must be dated before every case it serves, and later text and bylines are dropped; the result is the library extract, whose figures are not shown. Answer keys: each case's postmortem, which is never in the library, is drafted into a key, reviewed with every quote checked word for word and facts already stated during the incident marked, and frozen with its SHA-256. The investigator reads the case evidence and the library extract; the frozen keys are for the evaluation only. Every step fails closed: an unknown entry is dropped and listed, and a page without its date or a key with a missing field is refused.</desc>

          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#2d3142"/>

        <line x1="40" y1="280" x2="960" y2="280" stroke="rgba(245,245,245,0.10)" stroke-width="0.8"/>
        <line x1="40" y1="376" x2="960" y2="376" stroke="rgba(245,245,245,0.10)" stroke-width="0.8"/>

        <rect x="756" y="90" width="128" height="12" rx="2" fill="#2d3142"/>
        <text x="820" y="99" fill="#bfc0c0" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">INVESTIGATOR READS</text>
        <rect x="704" y="288" width="232" height="80" rx="8" fill="rgba(240,138,89,0.04)" stroke="#f08a59" stroke-width="0.8" stroke-dasharray="4,3"/>
        <rect x="768" y="282" width="104" height="12" rx="2" fill="#2d3142"/>
        <text x="820" y="291" fill="#f08a59" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">EVALUATION ONLY</text>
        <!-- Lane labels -->
        <text x="40" y="139" fill="#949eb2" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">CASE EVIDENCE</text>
        <text x="40" y="235" fill="#949eb2" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LIBRARY</text>
        <text x="40" y="331" fill="#949eb2" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ANSWER KEYS</text>

        <line x1="640" y1="136" x2="720" y2="136" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="344" y1="232" x2="400" y2="232" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="640" y1="232" x2="720" y2="232" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="344" y1="328" x2="400" y2="328" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="640" y1="328" x2="720" y2="328" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Steps -->
        <rect x="168" y="104" width="176" height="64" rx="6" fill="#2d3142"/>
        <rect x="168" y="104" width="176" height="64" rx="6" fill="rgba(245,245,245,0.05)" stroke="#bfc0c0" stroke-width="1"/>
        <rect x="176" y="112" width="23" height="12" rx="2" fill="transparent" stroke="rgba(191,192,192,0.50)" stroke-width="0.8"/>

        <text x="256" y="136" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Status snapshot</text>
        <text x="256" y="152" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Blob · SHA-256 checked</text>

        <text x="419.5" y="121" fill="#f5f5f5" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CUT</text>

        <rect x="720" y="104" width="200" height="64" rx="6" fill="#2d3142"/>
        <rect x="720" y="104" width="200" height="64" rx="6" fill="rgba(245,245,245,0.05)" stroke="#bfc0c0" stroke-width="1"/>
        <rect x="728" y="112" width="23" height="12" rx="2" fill="transparent" stroke="rgba(191,192,192,0.50)" stroke-width="0.8"/>
        <text x="739.5" y="121" fill="#bfc0c0" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OUT</text>
        <text x="820" y="136" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Case evidence</text>
        <text x="820" y="152" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">updates · Radar charts</text>

        <rect x="168" y="200" width="176" height="64" rx="6" fill="#2d3142"/>
        <rect x="168" y="200" width="176" height="64" rx="6" fill="rgba(245,245,245,0.05)" stroke="#bfc0c0" stroke-width="1"/>
        <rect x="176" y="208" width="23" height="12" rx="2" fill="transparent" stroke="rgba(191,192,192,0.50)" stroke-width="0.8"/>
        <text x="187.5" y="217" fill="#bfc0c0" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SRC</text>
        <text x="256" y="232" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Library page</text>
        <text x="256" y="248" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">picked by symptoms</text>

        <rect x="400" y="200" width="240" height="64" rx="6" fill="#2d3142"/>
        <rect x="400" y="200" width="240" height="64" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
        <rect x="408" y="208" width="23" height="12" rx="2" fill="transparent" stroke="rgba(245,245,245,0.40)" stroke-width="0.8"/>
        <text x="419.5" y="217" fill="#f5f5f5" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CUT</text>
        <text x="520" y="230" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Article cut + extract</text>
        <text x="520" y="244" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">dated before every case</text>
        <text x="520" y="256" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">later text, bylines dropped</text>

        <rect x="720" y="200" width="200" height="64" rx="6" fill="#2d3142"/>
        <rect x="720" y="200" width="200" height="64" rx="6" fill="rgba(245,245,245,0.05)" stroke="#bfc0c0" stroke-width="1"/>
        <rect x="728" y="208" width="23" height="12" rx="2" fill="transparent" stroke="rgba(191,192,192,0.50)" stroke-width="0.8"/>
        <text x="739.5" y="217" fill="#bfc0c0" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OUT</text>
        <text x="820" y="232" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Library extract</text>
        <text x="820" y="248" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">sections · figures, not shown</text>

        <rect x="168" y="296" width="176" height="64" rx="6" fill="#2d3142"/>
        <rect x="168" y="296" width="176" height="64" rx="6" fill="rgba(245,245,245,0.05)" stroke="#bfc0c0" stroke-width="1"/>
        <rect x="176" y="304" width="23" height="12" rx="2" fill="transparent" stroke="rgba(191,192,192,0.50)" stroke-width="0.8"/>
        <text x="187.5" y="313" fill="#bfc0c0" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SRC</text>
        <text x="256" y="328" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Case postmortem</text>

        <text x="419.5" y="313" fill="#f5f5f5" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">KEY</text>

        <text x="520" y="340" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">quotes checked word for word</text>
        <text x="520" y="352" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">stated-during-incident marked</text>

        <rect x="720" y="296" width="200" height="64" rx="6" fill="#2d3142"/>

        <text x="739.5" y="313" fill="#bfc0c0" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OUT</text>
        <text x="820" y="328" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Frozen key</text>
        <text x="820" y="344" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">SHA-256 in frozen.json</text>

        <!-- Legend -->
        <line x1="40" y1="408" x2="960" y2="408" stroke="rgba(245,245,245,0.10)" stroke-width="0.8"/>
        <text x="40" y="424" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="40" y="436" width="14" height="10" rx="2" fill="rgba(245,245,245,0.05)" stroke="#bfc0c0" stroke-width="1"/>
        <text x="60" y="444" fill="#bfc0c0" font-size="8.5" font-family="'Geist', sans-serif">Stored file</text>

        <rect x="136" y="436" width="14" height="10" rx="2" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
        <text x="156" y="444" fill="#bfc0c0" font-size="8.5" font-family="'Geist', sans-serif">Hindcast step</text>

        <rect x="240" y="436" width="14" height="10" rx="2" fill="rgba(240,138,89,0.04)" stroke="#f08a59" stroke-width="0.8" stroke-dasharray="4,3"/>
        <text x="260" y="444" fill="#bfc0c0" font-size="8.5" font-family="'Geist', sans-serif">Never reaches the investigator</text>

        <text x="960" y="424" fill="#949eb2" font-size="8.5" font-family="'Geist', sans-serif" text-anchor="end">Fails closed: unknown entries are dropped and listed; a page without its date or a key with a missing field is refused</text>
      </svg>
    </div>
  </div>
</body>
