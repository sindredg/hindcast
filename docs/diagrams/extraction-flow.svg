      <style>#extraction-flow-root { --color-paper:   #2d3142;
      --color-ink:     #f5f5f5;
      --color-muted:   #bfc0c0;
      --color-accent:  #f08a59;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #extraction-flow-root { font-family: var(--font-sans); color: var(--color-ink); }
      #extraction-flow-root .diagram-container { width: 100%; overflow-x: auto; }
      #extraction-flow-root .diagram-container { overflow-x: visible; }</style>
