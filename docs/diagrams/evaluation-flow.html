<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scoring the reconstructions</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #2d3142;
      --color-ink:     #f5f5f5;
      --color-muted:   #bfc0c0;
      --color-accent:  #f08a59;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 1000px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Evaluation · judge, review, score</p>
    <h1>Scoring the reconstructions</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 1000 704" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="evaluation-flow-title evaluation-flow-desc">
        <title id="evaluation-flow-title">Scoring the reconstructions</title>
        <desc id="evaluation-flow-desc">Every filled scored run and every prior-knowledge answer goes to the judge, claude-opus-5-5 on the Anthropic API, with the frozen keys and the rubric's outcome and support rules but without the run's arm or the labels; the reviewer, claude-fable-5-1 on the Anthropic API, judges each run and answer again from the same input without the judge's proposals, and its verdicts decide the review queue that the judge's proposals select; the score reads the judgments and the reviewer's decisions, a decision replacing the judge's proposal, and applies the frozen labels' credit; the Foundry cloud evaluators score repeat 1 of each arm and case with gpt-6.1-sol as their judge; both go into the evaluation report per arm and case.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#2d3142"/>

        <!-- Arrows -->
        <line x1="248" y1="84" x2="336" y2="84" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M248,108 H280 Q288,108 288,116 V168 Q288,176 296,176 H336" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="248" y1="192" x2="336" y2="192" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M248,288 H296 Q304,288 304,280 V216 Q304,208 312,208 H336" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="544" y1="192" x2="624" y2="192" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="728" y1="224" x2="728" y2="416" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="248" y1="460" x2="624" y2="460" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M440,224 V424 Q440,432 448,432 H624" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="728" y1="480" x2="728" y2="544" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M544,72 H872 Q880,72 880,80 V568 Q880,576 872,576 H832" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Arrow labels -->
        <rect x="566" y="172" width="36" height="12" rx="2" fill="#2d3142"/>
        <text x="584" y="181" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">QUEUE</text>
        <rect x="736" y="314" width="52" height="12" rx="2" fill="#2d3142"/>
        <text x="762" y="323" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DECISIONS</text>
        <rect x="320" y="440" width="40" height="12" rx="2" fill="#2d3142"/>
        <text x="340" y="449" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CREDIT</text>
        <rect x="448" y="314" width="56" height="12" rx="2" fill="#2d3142"/>
        <text x="476" y="323" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">JUDGMENTS</text>
        <rect x="888" y="314" width="72" height="12" rx="2" fill="#2d3142"/>
        <text x="924" y="323" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">MEANS PER ARM</text>

        <!-- Nodes: committed files -->
        <rect x="40" y="64" width="208" height="64" rx="6" fill="#2d3142"/>
        <rect x="40" y="64" width="208" height="64" rx="6" fill="rgba(245,245,245,0.05)" stroke="#bfc0c0" stroke-width="1"/>
        <text x="144" y="94" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Scored runs</text>
        <text x="144" y="110" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">60 runs · attempts.json</text>

        <rect x="40" y="160" width="208" height="64" rx="6" fill="#2d3142"/>
        <rect x="40" y="160" width="208" height="64" rx="6" fill="rgba(245,245,245,0.05)" stroke="#bfc0c0" stroke-width="1"/>
        <text x="144" y="190" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Prior answers</text>
        <text x="144" y="206" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">14 answers · no evidence</text>

        <rect x="40" y="256" width="208" height="64" rx="6" fill="#2d3142"/>
        <rect x="40" y="256" width="208" height="64" rx="6" fill="rgba(245,245,245,0.05)" stroke="#bfc0c0" stroke-width="1"/>
        <text x="144" y="286" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Frozen keys and rubric</text>
        <text x="144" y="302" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">rubric v3 · frozen prompts</text>

        <rect x="40" y="416" width="208" height="64" rx="6" fill="#2d3142"/>
        <rect x="40" y="416" width="208" height="64" rx="6" fill="rgba(245,245,245,0.05)" stroke="#bfc0c0" stroke-width="1"/>
        <text x="144" y="446" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Frozen labels</text>
        <text x="144" y="462" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">stated · inferable · not inferable</text>

        <rect x="624" y="544" width="208" height="64" rx="6" fill="#2d3142"/>
        <rect x="624" y="544" width="208" height="64" rx="6" fill="rgba(245,245,245,0.05)" stroke="#bfc0c0" stroke-width="1"/>
        <text x="728" y="574" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Evaluation report</text>
        <text x="728" y="590" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">per arm and case</text>

        <!-- Nodes: commands and services -->
        <rect x="336" y="40" width="208" height="64" rx="6" fill="#2d3142"/>
        <rect x="336" y="40" width="208" height="64" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
        <text x="440" y="70" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Foundry evaluators</text>
        <text x="440" y="86" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">repeat 1 · gpt-6.1-sol judges</text>

        <rect x="624" y="416" width="208" height="64" rx="6" fill="#2d3142"/>
        <rect x="624" y="416" width="208" height="64" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
        <text x="728" y="446" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Score</text>
        <text x="728" y="462" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">credit per label · kappa</text>

        <!-- Nodes: focal -->
        <rect x="336" y="160" width="208" height="64" rx="6" fill="#2d3142"/>
        <rect x="336" y="160" width="208" height="64" rx="6" fill="rgba(240,138,89,0.10)" stroke="#f08a59" stroke-width="1"/>
        <text x="440" y="190" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Judge</text>
        <text x="440" y="206" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">claude-opus-5-5 · Anthropic API</text>

        <rect x="624" y="160" width="208" height="64" rx="6" fill="#2d3142"/>
        <rect x="624" y="160" width="208" height="64" rx="6" fill="rgba(240,138,89,0.10)" stroke="#f08a59" stroke-width="1"/>
        <text x="728" y="190" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Reviewer</text>
        <text x="728" y="206" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">claude-fable-5-1 · judges blind</text>

        <!-- Legend strip -->
        <line x1="40" y1="648" x2="960" y2="648" stroke="rgba(245,245,245,0.10)" stroke-width="0.8"/>
        <text x="40" y="664" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="40" y="676" width="14" height="10" rx="2" fill="rgba(240,138,89,0.10)" stroke="#f08a59" stroke-width="1"/>
        <text x="60" y="684" fill="#bfc0c0" font-size="8.5" font-family="'Geist', sans-serif">Proposes and decides</text>

        <rect x="168" y="676" width="14" height="10" rx="2" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
        <text x="188" y="684" fill="#bfc0c0" font-size="8.5" font-family="'Geist', sans-serif">Command or service</text>

        <rect x="292" y="676" width="14" height="10" rx="2" fill="rgba(245,245,245,0.05)" stroke="#bfc0c0" stroke-width="1"/>
        <text x="312" y="684" fill="#bfc0c0" font-size="8.5" font-family="'Geist', sans-serif">Committed file</text>

        <text x="960" y="664" fill="#949eb2" font-size="8.5" font-family="'Geist', sans-serif" text-anchor="end">Neither model sees the run's arm or the labels; the reviewer never sees the judge's proposals</text>
      </svg>
    </div>
  </div>
</body>
</html>
