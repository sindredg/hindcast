        <title id="deployment-title">Where Hindcast runs</title>
        <desc id="deployment-desc">A reader's browser reaches the Hindcast container app over HTTPS; the app's built-in authentication redirects every request without a session to Entra ID and lets one account in, signing in as the app through a federated credential on its managed identity instead of a client secret. Every resource lives in one resource group that azd creates from Bicep and removes with azd down. The app runs on at most one replica that scales to zero and pulls its image from the group's container registry with its identity. With the same identity it runs the agent, Prompt Shields, PII detection, and the query embeddings on the Foundry resource and project, reads the runtime files and writes each run to Blob Storage, and queries the library index in Azure AI Search in Switzerland North. GitHub Actions builds the image on every pull request and, from the main branch only, exchanges its OIDC token with Entra ID for the CI identity and pushes the image to the registry. The app sends traces to Application Insights through its connection string, and the environment sends console logs to Log Analytics through a diagnostic setting.</desc>
