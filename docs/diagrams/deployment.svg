      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #deployment-root { font-family: var(--font-sans); color: var(--color-ink); }
      #deployment-root .diagram-container { width: 100%; overflow-x: auto; }
      #deployment-root .diagram-container { overflow-x: visible; }</style>
