<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 580" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="deployment-title deployment-desc" id="deployment-root">
        <title id="deployment-title">Where Hindcast runs</title>
        <desc id="deployment-desc">A reader's browser reaches the Hindcast container app over HTTPS; the app's built-in authentication redirects every request without a session to Entra ID and lets one account in, signing in as the app through a federated credential on its managed identity instead of a client secret. The app runs in its own resource group, created by azd from Bicep, on at most one replica that scales to zero, pulling the image from the group's container registry with its identity. GitHub Actions builds the image on every pull request and, from the main branch only, exchanges its OIDC token with Entra ID for the CI identity and pushes the image to the registry. The app sends traces to the existing Application Insights resource through its connection string, and the environment sends console logs to the existing Log Analytics workspace through a diagnostic setting; both live in the resource group built earlier, which azd never touches.</desc>
