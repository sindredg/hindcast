        <path d="M 760,416 V 440 Q 760,448 752,448 H 366 A 6,6 0 0 0 354,448 H 152 Q 144,448 144,456 V 496" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#investigation-loop-arrow)"/>
        <line x1="240" y1="528" x2="168" y2="528" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#investigation-loop-arrow)"/>
        <line x1="360" y1="560" x2="360" y2="608" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#investigation-loop-arrow)"/>
        <path d="M 96,560 V 620 Q 96,628 104,628 H 208" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#investigation-loop-arrow)"/>

        <!-- Arrow labels -->
        <rect x="368" y="214" width="28" height="12" rx="2" fill="#2d3142"/>
        <text x="382" y="223" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>
        <rect x="566" y="132" width="24" height="12" rx="2" fill="#2d3142"/>
        <text x="578" y="141" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>
        <rect x="550" y="364" width="28" height="12" rx="2" fill="#2d3142"/>
        <text x="564" y="373" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>
        <rect x="728" y="306" width="56" height="12" rx="2" fill="#2d3142"/>
        <text x="756" y="315" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NEXT TURN</text>
        <rect x="368" y="470" width="24" height="12" rx="2" fill="#2d3142"/>
        <text x="380" y="479" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>
        <rect x="104" y="374" width="48" height="12" rx="2" fill="#2d3142"/>
        <text x="128" y="383" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TIMEOUT</text>
