<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 744" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="investigation-loop-title investigation-loop-desc" id="investigation-loop-root">
        <title id="investigation-loop-title">The investigation loop</title>
        <desc id="investigation-loop-desc">The investigate command refuses a scored case before the rubric is frozen, or a case without its evidence file, before any model call. Otherwise it calls the investigator agent with the time left as the call's timeout; while the response holds function calls, it runs each case-bound tool, passes the result through the screen, and sends the outputs back in the next turn. A response without function calls is parsed against the schema and its citations are checked. A model call that times out, a thirteenth tool call, a tool call that would start after 120 seconds, a tool error, an empty answer, or a schema error ends the run as incomplete with the reason. Either way the result file is written and the command prints counts, never the investigation text.</desc>
        <defs>
      <style>#investigation-loop-root { --color-paper:   #2d3142;
      --color-ink:     #f5f5f5;
      --color-muted:   #bfc0c0;
      --color-accent:  #f08a59;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #investigation-loop-root { font-family: var(--font-sans); color: var(--color-ink); }
      #investigation-loop-root .diagram-container { width: 100%; overflow-x: auto; }
      #investigation-loop-root .diagram-container { overflow-x: visible; }</style>
          <marker id="investigation-loop-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#2d3142"/>

