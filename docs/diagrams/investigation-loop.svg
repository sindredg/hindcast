        <line x1="360" y1="208" x2="360" y2="240" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#investigation-loop-arrow)"/>
        <line x1="360" y1="304" x2="360" y2="336" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#investigation-loop-arrow)"/>
        <line x1="488" y1="384" x2="640" y2="384" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#investigation-loop-arrow)"/>
        <path d="M 720,352 V 280 Q 720,272 712,272 H 480" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#investigation-loop-arrow)"/>
        <line x1="360" y1="432" x2="360" y2="496" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#investigation-loop-arrow)"/>
