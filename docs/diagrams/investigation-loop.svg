        <text x="320" y="724" fill="#bfc0c0" font-size="8.5" font-family="'Geist', sans-serif">Model call</text>

        <rect x="392" y="716" width="14" height="10" rx="2" fill="#f08a59" fill-opacity="0.05" stroke="#f08a59" stroke-opacity="0.50" stroke-width="1" stroke-dasharray="4,4"/>
        <text x="412" y="724" fill="#bfc0c0" font-size="8.5" font-family="'Geist', sans-serif">Refusal</text>

        <rect x="472" y="716" width="14" height="10" rx="2" fill="#f5f5f5" fill-opacity="0.03" stroke="#bfc0c0" stroke-width="1" stroke-dasharray="4,4"/>
        <text x="492" y="724" fill="#bfc0c0" font-size="8.5" font-family="'Geist', sans-serif">Incomplete result</text>

        <text x="960" y="704" fill="#949eb2" font-size="8.5" font-family="'Geist', sans-serif" text-anchor="end">Caps: 12 tool calls, 120 seconds · reasons: tool-cap, time-cap, tool-error, empty-result, schema</text>
      </svg>
