        <rect x="656" y="384" width="144" height="48" rx="20" fill="#b4b4b4" fill-opacity="0.10" stroke="#8c8c8c" stroke-width="1"/>
        <text x="728" y="408" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Hits returned</text>
        <text x="728" y="424" fill="#b4b4b4" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ref · document · date</text>
        <rect x="816" y="384" width="144" height="48" rx="20" fill="#000000"/>
        <rect x="816" y="384" width="144" height="48" rx="20" fill="#b4b4b4" fill-opacity="0.10" stroke="#8c8c8c" stroke-width="1"/>
        <text x="888" y="408" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">LibraryLeak</text>
        <text x="888" y="424" fill="#b4b4b4" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">raised, none returned</text>

