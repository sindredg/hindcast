<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 536" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="retrieval-title retrieval-desc" id="retrieval-root">
        <title id="retrieval-title">Library index and search</title>
        <desc id="retrieval-desc">The index build reads the library extracts, checks each against its blob, cuts them into chunks that stay inside one section or one figure, embeds them through the Foundry resource endpoint, and pushes them to the library index in Azure AI Search, refusing an index that already holds documents. A search takes a case ID and a query: the filter comes from the registries alone (published before the case's start day and, unless the case is sealed, picked for the case), the query text reaches only the hybrid keyword, vector, and semantic search on the index, and every hit is checked again against the same rule and the extracts. Hits that pass are returned with their ref, document, and date; a hit outside the rule raises LibraryLeak and nothing is returned.</desc>
        <defs>
      <style>#retrieval-root { --color-paper:   #000000;
      --color-ink:     #f5f5f5;
      --color-muted:   #b4b4b4;
      --color-accent:  #22c55e;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #retrieval-root { font-family: var(--font-sans); color: var(--color-ink); }
      #retrieval-root .diagram-container { width: 100%; overflow-x: auto; }
      #retrieval-root .diagram-container { overflow-x: visible; }</style>
          <marker id="retrieval-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#b4b4b4"/></marker>
