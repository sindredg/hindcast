        <line x1="576" y1="204" x2="656" y2="204" stroke="#b4b4b4" stroke-width="1.2" marker-start="url(#retrieval-arrow-start)" marker-end="url(#retrieval-arrow)"/>
        <line x1="808" y1="240" x2="808" y2="272" stroke="#b4b4b4" stroke-width="1.2" marker-end="url(#retrieval-arrow)"/>
        <line x1="728" y1="344" x2="728" y2="384" stroke="#b4b4b4" stroke-width="1.2" marker-end="url(#retrieval-arrow)"/>
        <line x1="888" y1="344" x2="888" y2="384" stroke="#b4b4b4" stroke-width="1.2" marker-end="url(#retrieval-arrow)"/>

