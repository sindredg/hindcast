<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The investigation loop</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #2d3142;
      --color-ink:     #f5f5f5;
      --color-muted:   #bfc0c0;
      --color-accent:  #f08a59;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 1000px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Investigator</p>
    <h1>The investigation loop</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 1000 868" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="investigation-loop-title investigation-loop-desc">
        <title id="investigation-loop-title">The investigation loop</title>
        <desc id="investigation-loop-desc">The investigate command refuses a scored case before the rubric is frozen, a sealed case at any time, a case without its evidence file, its search or safety settings, or a price for its deployment, or screens off for a case that is not an injection copy, before any model call. Otherwise it calls the investigator agent with the time left as the call's timeout; while the response holds function calls, it runs each tool, the case evidence or the library search bound to the case, screens every item it returns with Prompt Shields and withholds a flagged one, and sends the outputs back in the next turn. A response without function calls is parsed against the schema and its citations are checked: a citation is kept only for an item the model was shown. Personal data in the answer is then masked. A model call that times out or fails, a thirteenth tool call, a tool call that would start after 120 seconds, a tool or screen error, an empty answer, a schema error, or a PII error ends the run as incomplete with the reason. Either way the result file is written and the command prints counts, never the investigation text.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#2d3142"/>

        <!-- Arrows -->
        <line x1="360" y1="80" x2="360" y2="96" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="520" y1="152" x2="640" y2="152" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="360" y1="208" x2="360" y2="240" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="360" y1="304" x2="360" y2="336" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="488" y1="384" x2="640" y2="384" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 720,352 V 280 Q 720,272 712,272 H 480" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="360" y1="432" x2="360" y2="496" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 240,272 H 104 Q 96,272 96,280 V 496" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 760,416 V 440 Q 760,448 752,448 H 366 A 6,6 0 0 0 354,448 H 152 Q 144,448 144,456 V 496" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="240" y1="528" x2="168" y2="528" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="360" y1="560" x2="360" y2="600" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="360" y1="664" x2="360" y2="712" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 240,632 H 128 Q 120,632 120,624 V 560" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 72,560 V 724 Q 72,732 80,732 H 208" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Arrow labels -->
        <rect x="368" y="214" width="28" height="12" rx="2" fill="#2d3142"/>
        <text x="382" y="223" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>
        <rect x="566" y="132" width="24" height="12" rx="2" fill="#2d3142"/>
        <text x="578" y="141" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>
        <rect x="550" y="364" width="28" height="12" rx="2" fill="#2d3142"/>
        <text x="564" y="373" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>
        <rect x="728" y="306" width="56" height="12" rx="2" fill="#2d3142"/>
        <text x="756" y="315" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NEXT TURN</text>
        <rect x="368" y="470" width="24" height="12" rx="2" fill="#2d3142"/>
        <text x="380" y="479" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>
        <rect x="104" y="374" width="84" height="12" rx="2" fill="#2d3142"/>
        <text x="146" y="383" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TIMEOUT · ERROR</text>
        <rect x="526" y="428" width="68" height="12" rx="2" fill="#2d3142"/>
        <text x="560" y="437" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CAP · ERROR</text>
        <rect x="180" y="508" width="48" height="12" rx="2" fill="#2d3142"/>
        <text x="204" y="517" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">INVALID</text>
        <rect x="368" y="574" width="40" height="12" rx="2" fill="#2d3142"/>
        <text x="388" y="583" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">VALID</text>
        <rect x="368" y="682" width="48" height="12" rx="2" fill="#2d3142"/>
        <text x="392" y="691" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">COMPLETE</text>
        <rect x="154" y="612" width="60" height="12" rx="2" fill="#2d3142"/>
        <text x="184" y="621" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PII ERROR</text>

        <!-- Nodes -->
        <rect x="240" y="40" width="240" height="40" rx="20" fill="#2d3142"/>
        <rect x="240" y="40" width="240" height="40" rx="20" fill="rgba(191,192,192,0.10)" stroke="#949eb2" stroke-width="1"/>
        <text x="360" y="64" fill="#f5f5f5" font-size="10" font-weight="400" font-family="'Geist Mono', monospace" text-anchor="middle">investigate &lt;case_id&gt;</text>
        <polygon points="360,96 520,152 360,208 200,152" fill="#2d3142"/>
        <polygon points="360,96 520,152 360,208 200,152" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
        <text x="360" y="141" fill="#f5f5f5" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Unscored, or rubric frozen</text>
        <text x="360" y="156" fill="#f5f5f5" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">and not sealed; evidence</text>
        <text x="360" y="171" fill="#f5f5f5" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">and settings present?</text>
        <rect x="640" y="120" width="240" height="64" rx="6" fill="#2d3142"/>
        <rect x="640" y="120" width="240" height="64" rx="6" fill="rgba(240,138,89,0.05)" stroke="rgba(240,138,89,0.50)" stroke-width="1" stroke-dasharray="4,4"/>
        <text x="760" y="146" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Refuse, call no model</text>
        <text x="760" y="162" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">nothing written · exit 1</text>
        <rect x="240" y="240" width="240" height="64" rx="6" fill="#2d3142"/>
        <rect x="240" y="240" width="240" height="64" rx="6" fill="rgba(240,138,89,0.10)" stroke="#f08a59" stroke-width="1"/>
        <text x="360" y="266" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Call the agent</text>
        <text x="360" y="282" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">its version · timeout = time left</text>
        <polygon points="360,336 488,384 360,432 232,384" fill="#2d3142"/>
        <polygon points="360,336 488,384 360,432 232,384" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
        <text x="360" y="381" fill="#f5f5f5" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Function calls</text>
        <text x="360" y="396" fill="#f5f5f5" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">in the response?</text>
        <rect x="640" y="352" width="240" height="64" rx="6" fill="#2d3142"/>
        <rect x="640" y="352" width="240" height="64" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
        <text x="760" y="378" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Run each tool, send outputs</text>
        <text x="760" y="394" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">each item screened · flagged withheld</text>
        <rect x="240" y="496" width="240" height="64" rx="6" fill="#2d3142"/>
        <rect x="240" y="496" width="240" height="64" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
        <text x="360" y="522" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Parse, check citations</text>
        <text x="360" y="538" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">schema · refs not shown or withheld</text>
        <rect x="24" y="496" width="144" height="64" rx="6" fill="#2d3142"/>
        <rect x="24" y="496" width="144" height="64" rx="6" fill="rgba(245,245,245,0.03)" stroke="#bfc0c0" stroke-width="1" stroke-dasharray="4,4"/>
        <text x="96" y="522" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Incomplete</text>
        <text x="96" y="538" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">the reason in the file</text>
        <rect x="240" y="600" width="240" height="64" rx="6" fill="#2d3142"/>
        <rect x="240" y="600" width="240" height="64" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
        <text x="360" y="626" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Mask personal data</text>
        <text x="360" y="642" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">PII detection · hit → [Category]</text>
        <rect x="208" y="712" width="304" height="40" rx="20" fill="#2d3142"/>
        <rect x="208" y="712" width="304" height="40" rx="20" fill="rgba(191,192,192,0.10)" stroke="#949eb2" stroke-width="1"/>
        <text x="360" y="736" fill="#f5f5f5" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Write the result file, print counts</text>

        <!-- Legend strip -->
        <line x1="40" y1="792" x2="960" y2="792" stroke="rgba(245,245,245,0.10)" stroke-width="0.8"/>
        <text x="40" y="808" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="40" y="820" width="22" height="10" rx="5" fill="rgba(191,192,192,0.10)" stroke="#949eb2" stroke-width="1"/>
        <text x="68" y="828" fill="#bfc0c0" font-size="8.5" font-family="'Geist', sans-serif">Start or end</text>

        <rect x="148" y="820" width="14" height="10" rx="2" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
        <text x="168" y="828" fill="#bfc0c0" font-size="8.5" font-family="'Geist', sans-serif">Step</text>

        <polygon points="224,819 232,825 224,831 216,825" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
        <text x="240" y="828" fill="#bfc0c0" font-size="8.5" font-family="'Geist', sans-serif">Decision</text>

        <rect x="300" y="820" width="14" height="10" rx="2" fill="rgba(240,138,89,0.10)" stroke="#f08a59" stroke-width="1"/>
        <text x="320" y="828" fill="#bfc0c0" font-size="8.5" font-family="'Geist', sans-serif">Model call</text>

        <rect x="392" y="820" width="14" height="10" rx="2" fill="rgba(240,138,89,0.05)" stroke="rgba(240,138,89,0.50)" stroke-width="1" stroke-dasharray="4,4"/>
        <text x="412" y="828" fill="#bfc0c0" font-size="8.5" font-family="'Geist', sans-serif">Refusal</text>

        <rect x="472" y="820" width="14" height="10" rx="2" fill="rgba(245,245,245,0.03)" stroke="#bfc0c0" stroke-width="1" stroke-dasharray="4,4"/>
        <text x="492" y="828" fill="#bfc0c0" font-size="8.5" font-family="'Geist', sans-serif">Incomplete result</text>

        <text x="40" y="852" fill="#949eb2" font-size="8.5" font-family="'Geist', sans-serif">Caps: 12 tool calls, 120 seconds · reasons: tool-cap, time-cap, model-error, tool-error, screen-error, empty-result, schema, pii-error</text>
      </svg>
    </div>
  </div>
</body>
</html>
